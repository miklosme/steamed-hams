<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steamed Hams player</title>
    <style>
      :root { color-scheme: dark; --bg: #14151a; --panel: #1d1f27; --line: #30333f; --text: #e6e7ec; --dim: #9a9eae; --accent: #f2b53a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; max-width: 1500px; margin: 0 auto; }
      #stage { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); overflow: hidden; }
      #stage canvas, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #stage video { pointer-events: none; }
      #bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
      #scrub { position: relative; flex: 1 1 100%; height: 26px; background: #0c0d11; border: 1px solid var(--line); cursor: pointer; }
      #scrub i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
      #scrub b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
      #scrub span { position: absolute; bottom: 0; height: 5px; }
      button, select { font: inherit; color: var(--text); background: #2a2d39; border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
      aside { background: var(--panel); border: 1px solid var(--line); padding: 10px; overflow: auto; max-height: calc((min(100vw, 1500px) - 376px) * 0.5625); min-height: 0; }
      aside h2 { font-size: 12px; margin: 12px 0 4px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      aside h2:first-child { margin-top: 0; }
      #readout { color: var(--accent); font-size: 15px; }
      .beat { padding: 2px 0; color: var(--dim); }
      .beat.on { color: var(--text); }
      .beat b { color: var(--accent); font-weight: 400; }
      .word { color: var(--dim); }
      .word.on { color: var(--accent); }
      kbd { border: 1px solid var(--line); padding: 0 4px; color: var(--dim); }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { max-height: none; } }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="gl"></canvas>
        <video id="ref" preload="auto" playsinline muted></video>
        <audio id="clock" preload="auto"></audio>
      </div>
      <aside>
        <div id="readout">loading</div>
        <h2>Shot</h2>
        <div id="shot"></div>
        <h2>Dialogue</h2>
        <div id="line"></div>
        <h2>Beats</h2>
        <div id="beats"></div>
      </aside>
      <div id="bar">
        <div id="scrub"><b></b></div>
        <button id="play">Play</button>
        <button id="prevShot" title="previous shot">|&lt;</button>
        <button id="prev" title="previous frame">&lt;</button>
        <button id="next" title="next frame">&gt;</button>
        <button id="nextShot" title="next shot">&gt;|</button>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="1" /></label>
        <label>Reference <input id="opacity" type="range" min="0" max="1" step="0.05" value="0" /></label>
        <span style="color: var(--dim)"><kbd>space</kbd> play <kbd>←</kbd><kbd>→</kbd> frame <kbd>shift</kbd>+<kbd>←</kbd><kbd>→</kbd> shot <kbd>o</kbd> reference</span>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
